		}

		}
		.banner_title {

		}
		.back_home {

			margin-right: 3px; */
			color: white;

			font-size: 20px;
			padding: auto;
			width: 50px;
		}
		.back_home:hover {
			background-color: #222;
		}
		.back_home:active {
			background-color: #555;
		}
		.use_translator_select, .from_lang_select, .to_lang_select {
			height: 50px;
			font-size: 25px;
			background-color: gray;
			color: white;
			margin-bottom: 10px;
			border: 0px;
		}
		.use_translator_select {
			margin-left: 20px;
			margin-right: 20px;
			width: calc(100% - 40px);
		}
		.from_lang_select {
			margin-left: 0;
			margin-right: 10px;
			width: calc(50% - 30px);
		}
		.to_lang_select {
			margin-left: 10;
			margin-right: 0px;
			width: calc(50% - 30px);
		}
		.input_text_box, .input_text {
			font-size: 25px;
			background-color: gray;
			border: none;
			color: white;
			line-height: 30px;
			text-align-last: auto;
			text-align: left;
		}
		.input_text_box {
			margin-left: 20px;
			margin-right: 20px;
			width: calc(100% - 40px);
			margin-bottom: 10px;
			border: 0px;
			display: flex;
			align-items: center;
			max-height: 320px;
			min-height: 50px;
		}
		.input_text {
			width: calc(100% - 10px);
			outline: none;
			max-width: 100%;
			box-shadow: none;
			resize: none;
			margin-top: 10px;
			overflow-y: auto;
			margin-bottom: 10px;
			margin-left: 5px;
			margin-right: 5px;
			max-height: 300px;
			min-height: 30px;
			appearance: none;
			-webkit-appearance: none;
			-webkit-tap-highlight-color: transparent;
			-webkit-overflow-scrolling: touch;
		}
		.input_text::placeholder {
			text-align: left;
			color: white;
			opacity: 0.6;
		}
		.input_text::-moz-placeholder {
			text-align: left;
			color: white;
			opacity: 0.6;
		}
		.input_text::-webkit-input-placeholder {
			text-align: left;
			color: white;
			opacity: 0.6;
		}
		.input_text:-ms-input-placeholder {
			text-align: left;
			color: white;
			opacity: 0.6;
		}
		.to_tranlate {
			background-color: #0f0;
			font-size: 25px;
			color: black;
			border-radius: 10px;
			padding-left: 40px;
		}
		.input_text:-ms-input-placeholder {
			text-align: left;
			color: white;
			opacity: 0.6;
		}
		.to_tranlate {
			background-color: #0f0;
			font-size: 25px;
			color: black;
			border-radius: 10px;
			padding-left: 40px;
			padding-right: 40px;
			padding-top: 10px;
			padding-bottom: 10px;
			max-width: 100vw;
			cursor: pointer;
		}
		.to_tranlate:active {
			background-color: #0a0;
		}
		select {
			cursor: pointer;
			max-width: 100%;
		}
		.translate_tip {
			width: 100%;
			color: #0f0;
			display: none;
			font-size: 15px;
			word-wrap: break-word;

		<div class="translate_tip" id="translate_tip">

		</div>

	<div class="decription">
		为什么使用智慧翻译：
		<div class="decription_p">1. 完全免费，任意使用而无需付任何一分钱</div>
		<div class="decription_p">2. 无广告，随意使用而不受广告打扰心情</div>
		<div class="decription_p">3. 不限制长度，翻译文本长度仅取决于翻译引擎设置</div>
		<div class="decription_p">4. 无次数限制，你可以随意翻译而不用担心次数用完</div>
	</div>
	<script>
		const input_text = document.getElementById('input_text')
		const translate_tip_dm = document.getElementById('translate_tip')
		const textareas = document.querySelectorAll('.input_text');
textareas.forEach(item => {
			let isComposing = false;
			function setAutoHeight(el) {
				el.style.height = '30px';
				const contentHeight = el.scrollHeight;
				el.style.height = contentHeight > 300 ? '300px' : contentHeight + 'px';
				translate_tip_dm.style.display = 'none'
			}
			item.addEventListener('input', () => {
				if (!isComposing) {
					setAutoHeight(item);
				}
			});
			item.addEventListener('compositionstart', () => {
				isComposing = true;
			});
			item.addEventListener('compositionend', () => {
				isComposing = false;
				setAutoHeight(item);
			});
			item.addEventListener('paste', () => {
				setTimeout(() => setAutoHeight(item), 10);
			});
			item.addEventListener('blur', () => {
				const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
				window.scrollTo(0, scrollTop);
			});
			setAutoHeight(item);
		});
		function translate_tip() {
			if (input_text.value.trim() != '') {
				translate_tip_dm.style.color = '#0f0'
				translate_tip_dm.innerHTML = '请稍等一会儿，即可看到翻译结果（若没有，请点击按钮再试）'
				translate_tip_dm.style.display = 'block'
			} else {
				translate_tip_dm.style.color = 'red'
				translate_tip_dm.innerHTML = '请输入需要翻译文本才能开始翻译！'
				translate_tip_dm.style.display = 'block'
				if (input_text.value != '') {
					let input_text_temp_value = input_text.value
					input_text.value = ''
					setTimeout(() => {
						input_text.value = input_text_temp_value
					}, 1)
				}
			}
		}
	</script>
